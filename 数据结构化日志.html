let filtered = [...structLogList];
let page = 1, pageSize = 10;

// 触发来源 → 标签样式
const TRIGGER_CLASS = { '定时调用服务任务': 'src-task', '结构化补偿任务': 'src-comp' };
function triggerTag(t) { return `<span class="src-tag ${TRIGGER_CLASS[t] || 'src-task'}">${escapeHtml(t)}</span>`; }
function modeTag(m) { return `<span class="mode-tag ${m === '补偿解析' ? 'comp' : ''}">${escapeHtml(m)}</span>`; }
function statusTag(s) { return `<span class="status-badge ${s==='成功'?'status-running':(s==='部分失败'?'status-partial':'status-not-enabled')}">${s}</span>`; }

function escapeHtml(str) { if (str === null || str === undefined) return ''; return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[m]); }
function tryFormatJson(s) { if (typeof s !== 'string') return s; try { return JSON.stringify(JSON.parse(s), null, 2); } catch(e) { return s; } }

function renderTable() {
    const api = document.getElementById('apiFilter').value.trim();
    const tg = document.getElementById('triggerFilter').value;
    const st = document.getElementById('statusFilter').value;
    // API名称为模糊匹配（补偿类日志一条记录含多个API）；排序按开始执行时间倒序，编号倒序（第1页第1行=总条数，最后一条=1）
    filtered = structLogList.filter(l =>
        (!api || l.api.includes(api)) && (!tg || l.trigger === tg) && (!st || l.status === st))
        .sort((a, b) => b.startTime.localeCompare(a.startTime));
    const total = Math.ceil(filtered.length / pageSize) || 1;
    if (page > total) page = total;
    const pageData = filtered.slice((page-1)*pageSize, page*pageSize);
    const tbody = document.getElementById('logTableBody');
    if (pageData.length === 0) { tbody.innerHTML = '<tr><td colspan="13" style="text-align:center;padding:40px;">暂无数据</td></tr>'; }
    else {
        tbody.innerHTML = pageData.map((l, idx) => {
            // 失败条数 > 0 时数字可点击，直接打开详情查看失败原因
            const failCell = l.fail > 0
                ? `<a class="fail-link" title="查看失败原因" onclick="viewDetail(${l.id}, true)">${l.fail}</a>`
                : '0';
            return `<tr>
            <td>${filtered.length - ((page-1)*pageSize + idx)}</td>
            <td class="cell-mono">${escapeHtml(l.logId)}</td>
            <td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escapeHtml(l.supplier)}">${escapeHtml(l.supplier)}</td>
            <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escapeHtml(l.api)}">${escapeHtml(l.api)}</td>
            <td style="white-space:nowrap;">${triggerTag(l.trigger)}</td>
            <td class="cell-mono" style="max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escapeHtml(l.targetDb + '.' + l.targetTable)}">${escapeHtml(l.targetDb)}.${escapeHtml(l.targetTable)}</td>
            <td>${l.total}</td>
            <td class="num-ok">${l.success}</td>
            <td class="${l.fail > 0 ? 'num-fail' : ''}">${failCell}</td>
            <td style="white-space:nowrap;">${escapeHtml(l.startTime)}</td>
            <td style="white-space:nowrap;">${escapeHtml(l.endTime)}</td>
            <td>${statusTag(l.status)}</td>
            <td><a class="action-link" onclick="viewDetail(${l.id})">详情</a></td>
        </tr>`;
        }).join('');
    }
    renderPagination(total, filtered.length);
    syncLogTableHeight();
}
// 表格最大高度 = 白卡内表格上方剩余的全部空间（与任务管理一致）：
// 内容少时表格按内容高度收窄、分页栏紧随其下；内容超出时才出现内部滚动条
function syncLogTableHeight() {
    const card = document.querySelector('.struct-white-card');
    const tableBox = document.querySelector('.table-container');
    const pagination = document.getElementById('logPagination');
    if (!card || !tableBox) return;
    const cardRect = card.getBoundingClientRect();
    const padBottom = parseFloat(getComputedStyle(card).paddingBottom) || 0;
    const pagH = pagination ? pagination.offsetHeight : 0;
    const avail = cardRect.bottom - padBottom - tableBox.getBoundingClientRect().top - pagH;
    if (!isFinite(avail)) return;
    tableBox.style.maxHeight = Math.max(120, Math.floor(avail)) + 'px';
}
function renderPagination(total, totalCount) {
    const container = document.getElementById('logPagination');
    let html = `<span class="total-text">共 ${totalCount} 条</span>`;
    html += `<button class="page-btn" ${page===1?'disabled':''} onclick="changePage(${page-1})">&lt;</button>`;
    // 页码窗口最多 5 个（对齐计费管理）
    let startP = Math.max(1, page - 2);
    let endP = Math.min(total, startP + 4);
    if (endP - startP < 4) startP = Math.max(1, endP - 4);
    for (let i=startP; i<=endP; i++) html += `<span class="page-number ${i===page?'active':''}" onclick="changePage(${i})">${i}</span>`;
    html += `<button class="page-btn" ${page===total?'disabled':''} onclick="changePage(${page+1})">&gt;</button>`;
    html += `<select class="page-size-select" onchange="changePageSize(this.value)"><option value="10" ${pageSize===10?'selected':''}>10条/页</option><option value="20" ${pageSize===20?'selected':''}>20条/页</option><option value="50" ${pageSize===50?'selected':''}>50条/页</option></select>`;
    html += `<div class="jump-section"><span>前往</span><input type="text" id="jumpPageInput" value="${page}" onkeydown="if(event.key==='Enter') jumpToPage()"><span>页</span></div>`;
    container.innerHTML = html;
}
function changePage(p) { page = p; renderTable(); }
function changePageSize(size) { pageSize = parseInt(size); page = 1; renderTable(); }
function jumpToPage() {
    const val = parseInt(document.getElementById('jumpPageInput').value);
    const total = Math.ceil(filtered.length / pageSize) || 1;
    if (!isNaN(val) && val >= 1 && val <= total) { page = val; renderTable(); }
}

let detailPage = 1;
let detailPageSize = 10;      // 与页面表格分页栏一致，可切换 10/20/50 条/页
let detailOwnerId = null;     // 当前详情弹窗属于哪一批（供 viewDetail 取批次公共字段）

// isFailOnly：true = 仅失败明细（点击失败条数进入）；false = 全部明细（点击详情进入）
function viewDetail(id, isFailOnly) {
    const l = structLogList.find(x => x.id === id);
    if (!l) return;
    detailOwnerId = id;
    let recs = l.records || [];
    if (isFailOnly) recs = recs.filter(r => r.status !== '成功');
    detailRecs = recs;
    detailPage = 1;
    renderDetail();
    document.getElementById('detailModal').classList.add('active');
}
function renderDetail() {
    const total = Math.ceil(detailRecs.length / detailPageSize) || 1;
    if (detailPage > total) detailPage = total;
    const pageData = detailRecs.slice((detailPage-1)*detailPageSize, detailPage*detailPageSize);
    document.getElementById('detailTableBody').innerHTML = pageData.map(r => {
        // 原始报文单元格：格式化 JSON，内部滚动
        const rawHtml = r.raw === '（原始报文缺失）'
            ? `<div class="raw-cell raw-empty">（原始报文缺失）</div>`
            : `<div class="raw-cell">${escapeHtml(tryFormatJson(r.raw))}</div>`;
        // 响应结果：成功 / 失败 + 具体原因（一条明细对应 1 个 API / 1 个供应商）
        let respHtml;
        if (r.status === '成功') {
            respHtml = `<div class="resp-block"><span class="resp-status resp-ok">成功</span><span class="resp-detail">报文解析成功，已写入目标表</span></div>`;
        } else {
            respHtml = `<div class="resp-block"><span class="resp-status resp-note">失败</span><span class="resp-detail">${escapeHtml((r.category ? r.category + '：' : '') + (r.reason || '解析失败'))}</span></div>`;
        }
        return `<tr>
            <td class="c-no">${r.no}</td>
            <td class="c-supplier" style="word-break:break-all;">${escapeHtml(r.supplier || '')}</td>
            <td class="c-api" style="word-break:break-all;">${escapeHtml(r.api || '')}</td>
            <td class="c-url cell-mono" style="word-break:break-all;text-align:left;">${escapeHtml(r.url || '')}</td>
            <td class="c-table cell-mono">${escapeHtml(r.targetTable)}</td>
            <td class="c-raw">${rawHtml}</td>
            <td class="c-resp">${respHtml}</td>
        </tr>`;
    }).join('') || '<tr><td colspan="7" style="text-align:center;padding:30px;">暂无明细数据</td></tr>';
    renderDetailPagination(total);
}
function renderDetailPagination(total) {
    const container = document.getElementById('detailPagination');
    // 与主列表分页栏完全一致：不论页数多少都渲染完整控件（共N条/翻页/页码/每页条数/跳页）
    let html = `<span class="total-text">共 ${detailRecs.length} 条</span>`;
    html += `<button class="page-btn" ${detailPage===1?'disabled':''} onclick="changeDetailPage(${detailPage-1})">&lt;</button>`;
    let startP = Math.max(1, detailPage - 2);
    let endP = Math.min(total, startP + 4);
    if (endP - startP < 4) startP = Math.max(1, endP - 4);
    for (let i=startP; i<=endP; i++) html += `<span class="page-number ${i===detailPage?'active':''}" onclick="changeDetailPage(${i})">${i}</span>`;
    html += `<button class="page-btn" ${detailPage===total?'disabled':''} onclick="changeDetailPage(${detailPage+1})">&gt;</button>`;
    html += `<select class="page-size-select" onchange="changeDetailPageSize(this.value)"><option value="10" ${detailPageSize===10?'selected':''}>10条/页</option><option value="20" ${detailPageSize===20?'selected':''}>20条/页</option><option value="50" ${detailPageSize===50?'selected':''}>50条/页</option></select>`;
    html += `<div class="jump-section"><span>前往</span><input type="text" id="jumpDetailPageInput" value="${detailPage}" onkeydown="if(event.key==='Enter') jumpDetailPage()"><span>页</span></div>`;
    container.innerHTML = html;
}
function changeDetailPage(p) { detailPage = p; renderDetail(); }
function changeDetailPageSize(size) { detailPageSize = parseInt(size); detailPage = 1; renderDetail(); }
function jumpDetailPage() {
    const val = parseInt(document.getElementById('jumpDetailPageInput').value);
    const total = Math.ceil(detailRecs.length / detailPageSize) || 1;
    if (!isNaN(val) && val >= 1 && val <= total) { detailPage = val; renderDetail(); }
}

// ======================== 事件绑定 ========================
document.getElementById('searchBtn').addEventListener('click', () => { page = 1; renderTable(); });
document.getElementById('resetBtn').addEventListener('click', () => {
    ['apiFilter','triggerFilter','statusFilter'].forEach(id => document.getElementById(id).value = '');
    page = 1; renderTable();
});
document.getElementById('closeDetailModal').addEventListener('click', () => document.getElementById('detailModal').classList.remove('active'));
document.getElementById('closeDetailBtn').addEventListener('click', () => document.getElementById('detailModal').classList.remove('active'));

renderTable();
window.addEventListener('resize', syncLogTableHeight);
</script>
</body>
</html>
