    [...new Set(structLogList.map(l => l.service))].forEach(s => { svc.innerHTML += `<option>${s}</option>`; });
})();

function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[m]); }
function tryFormatJson(s) { try { return JSON.stringify(JSON.parse(s), null, 2); } catch(e) { return s; } }

function renderTable() {
    const svc = document.getElementById('svcFilter').value;
    const st = document.getElementById('statusFilter').value;
    const tk = document.getElementById('taskFilter').value;
    const sd = document.getElementById('startDateFilter').value;
    const ed = document.getElementById('endDateFilter').value;
    filtered = structLogList.filter(l =>
        (!svc || l.service === svc) && (!st || l.status === st) && (!tk || l.sourceTask === tk) &&
        (!sd || l.startTime.slice(0,10) >= sd) && (!ed || l.startTime.slice(0,10) <= ed));
    const total = Math.ceil(filtered.length / pageSize) || 1;
    if (page > total) page = total;
    const pageData = filtered.slice((page-1)*pageSize, page*pageSize);
    const tbody = document.getElementById('logTableBody');
    if (pageData.length === 0) { tbody.innerHTML = '<tr><td colspan="12" style="text-align:center;padding:40px;">暂无数据</td></tr>'; }
    else {
        tbody.innerHTML = pageData.map((l, idx) => `<tr>
            <td>${(page-1)*pageSize + idx + 1}</td>
            <td style="font-size:12px;font-family:monospace;">${escapeHtml(l.logId)}</td>
            <td style="font-size:12px;font-family:monospace;">${escapeHtml(l.batchNo)}</td>
            <td>${escapeHtml(l.service)}</td>
            <td style="white-space:nowrap;">${escapeHtml(l.sourceTask)}</td>
            <td>${l.total}</td>
            <td class="num-ok">${l.success}</td>
            <td class="${l.fail > 0 ? 'num-fail' : ''}">${l.fail}</td>
            <td style="white-space:nowrap;">${escapeHtml(l.startTime)}</td>
            <td style="white-space:nowrap;">${escapeHtml(l.endTime)}</td>
            <td><span class="status-badge ${l.status==='成功'?'status-running':(l.status==='部分失败'?'status-partial':'status-not-enabled')}">${l.status}</span></td>
            <td><a class="action-link" onclick="viewDetail(${l.id})">查看</a></td>
        </tr>`).join('');
    }
    renderPagination(total, filtered.length);
}
function renderPagination(total, totalCount) {
    const container = document.getElementById('logPagination');
    let html = `<span class="total-text">共 ${totalCount} 条</span>`;
    html += `<button ${page===1?'disabled':''} onclick="changePage(${page-1})"><i class="el-icon-arrow-left"></i></button>`;
    const start = Math.max(1, page-2), end = Math.min(total, page+2);
    for (let i=start; i<=end; i++) html += `<span class="page-number ${i===page?'active':''}" onclick="changePage(${i})">${i}</span>`;
    html += `<button ${page===total?'disabled':''} onclick="changePage(${page+1})"><i class="el-icon-arrow-right"></i></button>`;
    html += `<select class="page-size-select" onchange="changePageSize(this.value)"><option value="10" ${pageSize===10?'selected':''}>10条/页</option><option value="20" ${pageSize===20?'selected':''}>20条/页</option><option value="50" ${pageSize===50?'selected':''}>50条/页</option></select>`;
    container.innerHTML = html;
}
function changePage(p) { page = p; renderTable(); }
function changePageSize(size) { pageSize = parseInt(size); page = 1; renderTable(); }

function viewDetail(id) {
    const l = structLogList.find(x => x.id === id);
    if (!l) return;
    document.getElementById('detailGrid').innerHTML = [
        ['日志ID', l.logId], ['批次号', l.batchNo], ['服务名称', l.service], ['来源任务', l.sourceTask],
        ['处理条数', l.total], ['成功条数', `<span class="num-ok">${l.success}</span>`], ['失败条数', l.fail > 0 ? `<span class="num-fail">${l.fail}</span>` : '0'],
        ['结构化状态', `<span class="status-badge ${l.status==='成功'?'status-running':(l.status==='部分失败'?'status-partial':'status-not-enabled')}">${l.status}</span>`],
        ['开始执行时间', l.startTime], ['结束执行时间', l.endTime]
    ].map(([k, v]) => `<div class="detail-item"><span class="dl">${k}：</span><span class="dv">${v}</span></div>`).join('');
    document.getElementById('detailRaw').textContent = l.rawSample;
    document.getElementById('detailStructured').textContent = tryFormatJson(l.structured);
    document.getElementById('detailFailWrap').style.display = l.failReason ? '' : 'none';
    document.getElementById('detailFail').textContent = l.failReason || '';
    document.getElementById('detailModal').classList.add('active');
}

document.getElementById('searchBtn').addEventListener('click', () => { page = 1; renderTable(); });
document.getElementById('resetBtn').addEventListener('click', () => {
    ['svcFilter','statusFilter','taskFilter','startDateFilter','endDateFilter'].forEach(id => document.getElementById(id).value = '');
    page = 1; renderTable();
});
document.getElementById('closeDetailModal').addEventListener('click', () => document.getElementById('detailModal').classList.remove('active'));
document.getElementById('closeDetailBtn').addEventListener('click', () => document.getElementById('detailModal').classList.remove('active'));

renderTable();
</script>
</body>
</html>
