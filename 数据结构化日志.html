let filtered = [...structLogList];
let page = 1, pageSize = 10;

// 已重试过的日志：点击「重试」后该条不再展示重试入口
const retriedIds = new Set();

function statusTag(s) { return `<span class="status-badge ${s === '成功' ? 'status-ok' : 'status-fail'}">${s}</span>`; }
function escapeHtml(str) { if (str === null || str === undefined) return ''; return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[m]); }

function renderTable() {
    const api = document.getElementById('apiFilter').value.trim();
    const st = document.getElementById('statusFilter').value;
    // 一条日志对应 1 个供应商 + 1 个 API，API名称为模糊匹配；排序按开始执行时间倒序，编号倒序（第1页第1行=总条数，最后一条=1）
    filtered = structLogList.filter(l => (!api || l.api.includes(api)) && (!st || l.status === st))
        .sort((a, b) => b.startTime.localeCompare(a.startTime));
    const total = Math.ceil(filtered.length / pageSize) || 1;
    if (page > total) page = total;
    const pageData = filtered.slice((page-1)*pageSize, page*pageSize);
    const tbody = document.getElementById('logTableBody');
    if (pageData.length === 0) { tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:40px;">暂无数据</td></tr>'; }
    else {
        tbody.innerHTML = pageData.map((l, idx) => {
            // 结构化失败时提供「重试」（发起结构化补偿）；已重试过的不再展示
            const ops = [`<a class="action-link" onclick="viewDetail(${l.id})">详情</a>`];
            if (l.status === '失败' && !retriedIds.has(l.id)) {
                ops.push(`<a class="action-link retry" title="对该条日志发起结构化补偿" onclick="retryStruct(${l.id})">重试</a>`);
            }
            return `<tr>
            <td>${filtered.length - ((page-1)*pageSize + idx)}</td>
            <td class="cell-mono" style="white-space:nowrap;">${escapeHtml(l.logId)}</td>
            <td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escapeHtml(l.supplier)}">${escapeHtml(l.supplier)}</td>
            <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escapeHtml(l.api)}">${escapeHtml(l.api)}</td>
            <td class="cell-mono" style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escapeHtml(l.url)}">${escapeHtml(l.url)}</td>
            <td class="cell-mono">${(l.targetTables || []).map(t => escapeHtml(t)).join('<br>') || '-'}</td>
            <td style="white-space:nowrap;">${escapeHtml(l.startTime)}</td>
            <td style="white-space:nowrap;">${escapeHtml(l.endTime)}</td>
            <td>${statusTag(l.status)}</td>
            <td style="white-space:nowrap;">${ops.join('')}</td>
        </tr>`;
        }).join('');
    }
    renderPagination(total, filtered.length);
    syncLogTableHeight();
}
// 表格最大高度 = 白卡内表格上方剩余的全部空间（与任务管理一致）：
// 内容少时表格按内容高度收窄、分页栏紧随其下；内容超出时才出现内部滚动条
function syncLogTableHeight() {
    const card = document.querySelector('.struct-white-card');
    const tableBox = document.querySelector('.table-container');
    const pagination = document.getElementById('logPagination');
    if (!card || !tableBox) return;
    const cardRect = card.getBoundingClientRect();
    const padBottom = parseFloat(getComputedStyle(card).paddingBottom) || 0;
    const pagH = pagination ? pagination.offsetHeight : 0;
    const avail = cardRect.bottom - padBottom - tableBox.getBoundingClientRect().top - pagH;
    if (!isFinite(avail)) return;
    tableBox.style.maxHeight = Math.max(120, Math.floor(avail)) + 'px';
}
function renderPagination(total, totalCount) {
    const container = document.getElementById('logPagination');
    let html = `<span class="total-text">共 ${totalCount} 条</span>`;
    html += `<button class="page-btn" ${page===1?'disabled':''} onclick="changePage(${page-1})">&lt;</button>`;
    // 页码窗口最多 5 个（对齐计费管理）
    let startP = Math.max(1, page - 2);
    let endP = Math.min(total, startP + 4);
    if (endP - startP < 4) startP = Math.max(1, endP - 4);
    for (let i=startP; i<=endP; i++) html += `<span class="page-number ${i===page?'active':''}" onclick="changePage(${i})">${i}</span>`;
    html += `<button class="page-btn" ${page===total?'disabled':''} onclick="changePage(${page+1})">&gt;</button>`;
    html += `<select class="page-size-select" onchange="changePageSize(this.value)"><option value="10" ${pageSize===10?'selected':''}>10条/页</option><option value="20" ${pageSize===20?'selected':''}>20条/页</option><option value="50" ${pageSize===50?'selected':''}>50条/页</option></select>`;
    html += `<div class="jump-section"><span>前往</span><input type="text" id="jumpPageInput" value="${page}" onkeydown="if(event.key==='Enter') jumpToPage()"><span>页</span></div>`;
    container.innerHTML = html;
}
function changePage(p) { page = p; renderTable(); }
function changePageSize(size) { pageSize = parseInt(size); page = 1; renderTable(); }
function jumpToPage() {
    const val = parseInt(document.getElementById('jumpPageInput').value);
    const total = Math.ceil(filtered.length / pageSize) || 1;
    if (!isNaN(val) && val >= 1 && val <= total) { page = val; renderTable(); }
}

// ======================== 重试（结构化补偿） ========================
// 结构化状态为「失败」时，操作栏提供「重试」：
//   1. 点击后立即隐藏该条的「重试」入口；
//   2. 发起结构化补偿，并在列表新增一条补偿后的结构化日志（状态「成功」）。
const pad2 = n => String(n).padStart(2, '0');
function fmtTime(d) {
    return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
}
function retryStruct(id) {
    const l = structLogList.find(x => x.id === id);
    if (!l || l.status !== '失败' || retriedIds.has(id)) return;
    retriedIds.add(id);

    const now = new Date();
    const done = new Date(now.getTime() + 3000);              // 补偿解析耗时（演示用）
    const dateKey = `${now.getFullYear()}${pad2(now.getMonth()+1)}${pad2(now.getDate())}`;
    // 新日志ID：STRUCT-执行日期-序号（同日已有日志的序号顺延）
    let seq = 1;
    structLogList.forEach(x => {
        const m = new RegExp('^STRUCT-' + dateKey + '-(\\d+)$').exec(x.logId);
        if (m) seq = Math.max(seq, parseInt(m[1], 10) + 1);
    });
    const newLog = {
        id: Math.max(...structLogList.map(x => x.id)) + 1,
        logId: `STRUCT-${dateKey}-${String(seq).padStart(4, '0')}`,
        batchNo: l.batchNo,
        api: l.api, supplier: l.supplier, url: l.url, targetTables: [...(l.targetTables || [])],
        startTime: fmtTime(now), endTime: fmtTime(done), status: "成功",
        reqParams: l.reqParams, respBody: l.respBody
    };
    structLogList.push(newLog);
    page = 1;
    renderTable();
    showToast('已发起结构化补偿，重新解析成功，新增日志 ' + newLog.logId, 'success');
}

// Toast 提示（对齐任务管理）
function showToast(message, type) {
    type = type || 'info';
    var icons = { success: 'el-icon-circle-check', error: 'el-icon-circle-close', warning: 'el-icon-warning', info: 'el-icon-info' };
    var container = document.getElementById('toastContainer');
    var toast = document.createElement('div');
    toast.className = 'toast ' + type;
    toast.innerHTML = '<i class="' + (icons[type] || icons.info) + '"></i><span>' + message + '</span>';
    container.appendChild(toast);
    setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 2500);
}

// ======================== 详情弹窗（与调用日志-供应商详情版式一致） ========================
// 日志ID + URL（可复制）+「请求参数 / 响应参数 / 结构化结果」三个页签
// 结构化结果：成功 → 绿色「成功」；失败 → 红色失败原因
let curDetailRow = null;
let curDetailParams = {};
let curDetailRespBody = '';

function viewDetail(id) {
    const l = structLogList.find(x => x.id === id);
    if (!l) return;
    curDetailRow = l;
    curDetailParams = l.reqParams || {};
    curDetailRespBody = l.respBody || '';
    document.getElementById('dlgLogId').textContent = l.logId;
    document.getElementById('dlgUrl').textContent = l.url;
    switchDetailTab('req');
    document.getElementById('detailModal').classList.add('active');
}

function renderDetailReqParams() {
    const keys = Object.keys(curDetailParams);
    let html = '<table class="dlg-params-table"><thead><tr><th style="width:220px;">参数名</th><th>参数值</th></tr></thead><tbody>';
    if (keys.length === 0) {
        html += '<tr><td colspan="2" style="text-align:center;color:#999;padding:24px 0;">无请求参数</td></tr>';
    } else {
        keys.forEach(k => { html += `<tr><td>${escapeHtml(k)}</td><td>${escapeHtml(curDetailParams[k])}</td></tr>`; });
    }
    html += '</tbody></table>';
    document.getElementById('dlgContent').innerHTML = html;
}

function renderDetailRespParams() {
    let pretty = curDetailRespBody;
    // 标准JSON → 格式化展示；截断报文等非标准内容原样展示
    try { pretty = JSON.stringify(JSON.parse(curDetailRespBody), null, 2); } catch (e) { /* 原样展示 */ }
    document.getElementById('dlgContent').innerHTML = '<pre class="dlg-json">' + escapeHtml(pretty) + '</pre>';
}

function renderDetailStructResult() {
    const l = curDetailRow;
    if (!l) { document.getElementById('dlgContent').innerHTML = '<div class="dlg-struct-empty">无结构化结果</div>'; return; }
    if (l.status === '成功') {
        document.getElementById('dlgContent').innerHTML = '<div class="dlg-struct-msg success">成功</div>';
    } else {
        document.getElementById('dlgContent').innerHTML = '<div class="dlg-struct-msg fail">' + escapeHtml(l.failReason || '解析失败') + '</div>';
    }
}

function switchDetailTab(tab) {
    document.getElementById('tabDetailReq').classList.toggle('active', tab === 'req');
    document.getElementById('tabDetailResp').classList.toggle('active', tab === 'resp');
    document.getElementById('tabDetailStruct').classList.toggle('active', tab === 'struct');
    if (tab === 'req') renderDetailReqParams();
    else if (tab === 'resp') renderDetailRespParams();
    else renderDetailStructResult();
}

function copyDetailUrl() {
    const url = document.getElementById('dlgUrl').textContent;
    function done() { showToast('URL 已复制', 'success'); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(done, done);
    } else {
        const ta = document.createElement('textarea');
        ta.value = url;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        done();
    }
}

function closeDetailModal() { document.getElementById('detailModal').classList.remove('active'); }

// ======================== 事件绑定 ========================
document.getElementById('searchBtn').addEventListener('click', () => { page = 1; renderTable(); });
document.getElementById('resetBtn').addEventListener('click', () => {
    ['apiFilter','statusFilter'].forEach(id => document.getElementById(id).value = '');
    page = 1; renderTable();
});
document.getElementById('closeDetailModal').addEventListener('click', closeDetailModal);
document.getElementById('closeDetailBtn').addEventListener('click', closeDetailModal);
document.getElementById('copyUrlBtn').addEventListener('click', copyDetailUrl);
document.getElementById('tabDetailReq').addEventListener('click', () => switchDetailTab('req'));
document.getElementById('tabDetailResp').addEventListener('click', () => switchDetailTab('resp'));
document.getElementById('tabDetailStruct').addEventListener('click', () => switchDetailTab('struct'));
document.getElementById('detailModal').addEventListener('click', function(e) { if (e.target === this) closeDetailModal(); });

renderTable();
window.addEventListener('resize', syncLogTableHeight);
</script>
